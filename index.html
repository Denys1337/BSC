<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BSC Header</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Prata&family=Source+Serif+4:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/swiper/swiper-bundle.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- header -->
    <header class="header">
      <div class="container">
        <div class="logo">
          <img src="images/Logo.svg" alt="BSC Logo" />
        </div>
        <div class="nav-wrapper">
          <nav class="nav" id="nav">
            <div class="closeButton">
              <img src="images/closeButton.svg" />
            </div>
            <div id="languageToggle" class="toggle-wrapper">
              <div class="toggle-option ukr">
                <span>Укр</span>
                <div class="dot"></div>
              </div>
              <div class="toggle-option eng">
                <span>Eng</span>
                <div class="dot"></div>
              </div>
            </div>
            <ul class="nav-list">
              <li><a href="#" class="active">Головна</a></li>
              <li><a href="#">Про BSC</a></li>
              <li><a href="#">Послуги</a></li>
              <li><a href="#">Події та заходи</a></li>
              <li><a href="#">Партнери</a></li>
              <li><a href="#">Галерея</a></li>
              <li><a href="#">Вакансії</a></li>
              <li><a href="#">Контакти</a></li>
            </ul>
          </nav>

          <div class="language-select" id="langSelect">
            <div class="selected-lang">
              <span id="currentLang">UK</span>
              <span class="arrow"><img src="images/arrowLang.svg" /></span>
            </div>
            <div class="language-options">
              <span id="otherLang">EN</span>
            </div>
          </div>

          <div class="burger" id="burger">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </header>
     <!-- breadcrumbs  -->
     <section class="sectionWrapper breadcrumbsPadding">
        <div class="container containerSection">
          <div class="breadcrumbs ">
            <a href="#">Головна</a>
            <img src="images/arrow.svg" alt="">
            <p>Галерея</p>
          </div>
        </div>
    </section>
    <!-- Галерея -->
    <section class="sectionWrapper aboutPagePadding">
        <div class="container containerSection">
          <h2>Галерея</h2>
          <div class="containerGallery">
            <div class="gridGallery" id="cardContainer">
              <!-- Cards will be inserted here -->
            </div>
            <div class="pagination" id="pagination"></div>
          </div>
        
          <div class="popup" id="popup">
            <span class="close" id="popupClose"><img src="images/closeButton.svg"/></span>
            <div class="popup-content" id="popupContent"></div>
          </div>
        </div>
    </section>
    <!-- footer -->
    <footer>
      <div class="container footerWrapper">
        <div class="footer-left">
          <div class="logo">
            <img src="images/LogoFooter.svg" alt="BSC Logo" />
          </div>
          <nav class="footer-nav">
            <a href="#">Про BSC</a>
            <a href="#">Послуги</a>
            <a href="#">Події та заходи</a>
            <a href="#">Партнери</a>
            <a href="#">Галерея</a>
            <a href="#">Вакансії</a>
          </nav>
        </div>

        <div class="footer-right">
          <div>
            <h4>Контакти</h4>
            <p>+380937458745</p>
            <p>bpc.support@gmail.com</p>
            <p>м. Вінниця, вул. Соборна 53</p>
          </div>
          <div class="social-icons">
            <a href="#"><img src="images/facebook.svg"/></i></a>
            <a href="#"><img src="images/insta.svg"/></i></a>
          </div>
        </div>
      </div>
    </footer>
    <script src="script.js"></script>  
    <script>
        const data = [
          { type: 'image', src: 'images/about2.svg', title: 'Назва події' },
          { type: 'image', src: 'images/about2.svg', title: 'Назва події' },
          { type: 'video', src: 'https://www.w3schools.com/html/mov_bbb.mp4', title: 'Назва події' },
          { type: 'image', src: 'images/about2.svg', title: 'Назва події' },
          { type: 'image', src: 'images/about2.svg', title: 'Назва події' },
          { type: 'image', src: 'images/about2.svg', title: 'Назва події' },
          { type: 'video', src: 'https://www.w3schools.com/html/mov_bbb.mp4', title: 'Назва події' },
          { type: 'image', src: 'images/about2.svg', title: 'Назва події' }
        ];
    
        const itemsPerPage = 30;
        let currentPage = 1;
    
        function renderCards() {
          const start = (currentPage - 1) * itemsPerPage;
          const end = start + itemsPerPage;
          const currentItems = data.slice(start, end);
          const container = document.getElementById("cardContainer");
          container.innerHTML = "";
    
          currentItems.forEach(item => {
            const card = document.createElement("div");
            card.className = "cardGallery";
    
            const media = item.type === 'image'
            ? `<img src="${item.src}" alt="${item.title}" />`
            : `
              <div class="video-wrapper">
                <video src="${item.src}" muted></video>
                <button class="video-play-btn" aria-label="Play video">▶</button>
              </div>
            `;
    
            card.innerHTML = `
              ${media}
              <div class="expand-icon"><img src="images/openGallery.svg"/></div>
              <div class="title">${item.title}</div>
            `;
    
            card.querySelector(".expand-icon").addEventListener("click", () => {
              showPopup(item);
            });
            if(card.querySelector(".video-play-btn")) {
            card.querySelector(".video-play-btn").addEventListener("click", () => {
              showPopup(item);
            });
          }
    
            container.appendChild(card);
          });
        }
    
        function renderPagination() {
          const totalPages = Math.ceil(data.length / itemsPerPage);
          const pagination = document.getElementById("pagination");
          pagination.innerHTML = "";
    
          for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement("button");
            btn.innerText = i;
            btn.classList.toggle("active", i === currentPage);
            btn.addEventListener("click", () => {
              currentPage = i;
              renderCards();
              renderPagination();
            });
            pagination.appendChild(btn);
          }
        }
    
        function showPopup(item) {
          const popup = document.getElementById("popup");
          const content = document.getElementById("popupContent");
    
          content.innerHTML = item.type === 'image'
            ? `<h3>${item.title}</h3><img src="${item.src}" alt="popup" />`
            : `<h3>${item.title}</h3><video src="${item.src}" controls autoplay></video>`;
    
          popup.style.display = "flex";
        }
    
        document.getElementById("popupClose").addEventListener("click", () => {
          document.getElementById("popup").style.display = "none";
          document.getElementById("popupContent").innerHTML = "";
        });
    
        renderCards();
        renderPagination();
      </script>  
  </body>
</html>
